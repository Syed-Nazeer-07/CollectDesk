# Fictional/demo-only Render preview; requires a separate MongoDB Atlas database.
# Secrets are configured in Render, never stored in this repository.
services:
  - type: web
    name: collectdesk-preview
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile.render
    dockerCommand: node scripts/start-hosted.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_SEED_PASSWORD
        sync: false
      - key: SEED_DEMO_ON_START
        value: 'true'
