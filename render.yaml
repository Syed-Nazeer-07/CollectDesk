# Fictional/demo-only Render preview; requires a separate MongoDB Atlas database.
# Secrets are configured in Render, never stored in this repository.
services:
  - type: web
    name: collectdesk-preview
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile.render
    dockerCommand: node scripts/start-hosted.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    # CI still runs for all commits; only runtime-affecting changes redeploy.
    # A docs/test-only commit must not restart an idle free demo server.
    buildFilter:
      paths:
        - apps/api/**
        - apps/web/**
        - scripts/start-hosted.mjs
        - Dockerfile.render
        - .dockerignore
        - package.json
        - package-lock.json
        - render.yaml
      ignoredPaths:
        - apps/api/test/**
        - docs/**
        - README.md
        - .github/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_SEED_PASSWORD
        sync: false
      # The fictional dataset is seeded once during initial provisioning.
      # Re-running seed on every free-instance cold start delays page loading.
      - key: SEED_DEMO_ON_START
        value: 'false'
