name: CollectDesk checks

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-22.04 # Temporary: MongoDB 8.0 fails on newer hosted-runner kernels (SERVER-121912)
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/collectdesk_ci_test
      WEB_ORIGIN: http://localhost:3000
      JWT_SECRET: collectdesk-only-for-ci-tests-do-not-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck -w @collectdesk/web
      - name: Run unit and API integration tests
        env:
          NODE_ENV: test
        run: npm test
      - name: Build Next.js frontend
        run: npm run build

      - name: Build and syntax-check Render hosted container
        run: |
          node --check scripts/start-hosted.mjs
          docker build --file Dockerfile.render --tag collectdesk-render-ci .

      - name: Install Chromium for browser audit
        run: npx playwright install --with-deps chromium

      - name: Seed fictional demo and smoke-test running full stack
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/collectdesk_ci_demo
          DEMO_SEED_PASSWORD: CI-Demo-Only-Password-2026!
          SMOKE_EMAIL: admin@demo.collectdesk.test
          SMOKE_PASSWORD: CI-Demo-Only-Password-2026!
        run: |
          npm run seed
          npm run start:api > /tmp/collectdesk-api.log 2>&1 &
          npm run start -w @collectdesk/web > /tmp/collectdesk-web.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null && curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              break
            fi
            sleep 2
          done
          npm run smoke
          npm run audit:browser

      - name: Verify hosted container serves frontend and authenticated API
        env:
          DEMO_SEED_PASSWORD: CI-Demo-Only-Password-2026!
        run: |
          docker run -d --name collectdesk-render-ci \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:10000:10000 \
            -e NODE_ENV=production \
            -e PORT=10000 \
            -e MONGODB_URI=mongodb://host.docker.internal:27017/collectdesk_ci_demo \
            -e JWT_SECRET=collectdesk-only-for-ci-tests-do-not-use-in-production \
            -e WEB_ORIGIN=http://127.0.0.1:10000 \
            -e SEED_DEMO_ON_START=true \
            -e DEMO_SEED_PASSWORD="$DEMO_SEED_PASSWORD" \
            collectdesk-render-ci
          ready=0
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:10000/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs collectdesk-render-ci
            exit 1
          fi
          SMOKE_WEB_URL=http://127.0.0.1:10000 \
          SMOKE_API_URL=http://127.0.0.1:4000 \
          SMOKE_EMAIL=admin@demo.collectdesk.test \
          SMOKE_PASSWORD="$DEMO_SEED_PASSWORD" npm run smoke

      - name: Upload browser audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collectdesk-browser-audit
          path: browser-audit-results/
          if-no-files-found: ignore
          retention-days: 14
