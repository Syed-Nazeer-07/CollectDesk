name: Live Render preview diagnostics

on:
  push:
    branches: [main]
    paths:
      - scripts/live-preview-check.mjs
      - .github/workflows/live-preview.yml
      - apps/web/next.config.ts
      - apps/api/src/auth.js
      - apps/api/src/app.js
      - apps/web/lib/api.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-external-preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose public network path (no credentials)
        run: |
          echo "DNS resolution for hosted preview"
          getent ahosts collectdesk-preview-ah80.onrender.com | head -n 5 || true
          echo "Sanity check against Render homepage"
          curl --location --head --silent --show-error --connect-timeout 8 --max-time 14 https://render.com | head -n 10 || true
          echo "Verbose public service handshake"
          curl --head --verbose --connect-timeout 10 --max-time 22 https://collectdesk-preview-ah80.onrender.com/api/health 2>&1 | tail -n 45 || true
      - name: Check public Render HTTPS, API proxy and login origin
        run: node scripts/live-preview-check.mjs
